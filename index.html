                                                            <input type="checkbox" checked={checklist[`during_custom_${i}`] || false} onChange={() => handleChecklistToggle(`during_custom_${i}`)} className="w-4 h-4 text-teal-600 rounded" />
                                                            <span className={checklist[`during_custom_${i}`] ? "line-through text-slate-400" : "text-slate-700"}>{nd}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* After Administration */}
                                            <div className="bg-white p-6 rounded-xl shadow">
                                                <h4 className="font-bold text-lg text-teal-900 mb-3 flex items-center gap-2">
                                                    <span>3️⃣</span> After Administration & Monitoring
                                                </h4>
                                                <div className="space-y-2 text-sm">
                                                    <label className="flex items-center space-x-3 cursor-pointer">
                                                        <input type="checkbox" checked={checklist.after1} onChange={() => handleChecklistToggle('after1')} className="w-4 h-4 text-teal-600 rounded" />
                                                        <span className={checklist.after1 ? "line-through text-slate-400" : "text-slate-700"}>Monitor for expected therapeutic response and adverse reactions.</span>
                                                    </label>
                                                    <label className="flex items-center space-x-3 cursor-pointer">
                                                        <input type="checkbox" checked={checklist.after2} onChange={() => handleChecklistToggle('after2')} className="w-4 h-4 text-teal-600 rounded" />
                                                        <span className={checklist.after2 ? "line-through text-slate-400" : "text-slate-700"}>Document medication administration accurately in patient clinical record.</span>
                                                    </label>
                                                    {selectedDrug.nursingAfter.map((na, i) => (
                                                        <label key={i} className="flex items-center space-x-3 cursor-pointer">
                                                            <input type="checkbox" checked={checklist[`after_custom_${i}`] || false} onChange={() => handleChecklistToggle(`after_custom_${i}`)} className="w-4 h-4 text-teal-600 rounded" />
                                                            <span className={checklist[`after_custom_${i}`] ? "line-through text-slate-400" : "text-slate-700"}>{na}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Nurse Reminders Box */}
                                        <div className="mt-6 bg-teal-950 p-6 rounded-xl border border-teal-800 text-white">
                                            <h4 className="font-bold text-teal-300 mb-2">📌 What the Nurse Should Not Forget:</h4>
                                            <ul className="list-disc pl-5 space-y-1 text-teal-100 text-sm">
                                                {selectedDrug.nurseReminders.map((nr, i) => <li key={i}>{nr}</li>)}
                                            </ul>
                                        </div>
                                    </div>

                                    {/* References */}
                                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                                        <h3 className="text-xl font-bold text-slate-900 mb-4">5. Medical References & Evidence</h3>
                                        <ul className="space-y-3">
                                            {selectedDrug.references.map((ref, i) => (
                                                <li key={i} className="text-sm flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-50 p-3 rounded-lg border border-slate-200">
                                                    <div>
                                                        <span className="font-semibold text-slate-900">{ref.org}</span> - <span className="text-slate-700">{ref.title}</span> ({ref.date})
                                                    </div>
                                                    <a href={ref.url} target="_blank" rel="noopener noreferrer" className="text-teal-600 font-medium hover:underline mt-1 sm:mt-0 text-xs">
                                                        Visit Source ↗
                                                    </a>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* DRUG COMPARISON TAB */}
                        {activeTab === 'compare' && (
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                                <div className="mb-8 text-center">
                                    <h2 className="text-3xl font-extrabold text-slate-900">Medication Comparison Tool</h2>
                                    <p className="text-slate-600 text-sm mt-1">Select two medications to compare their classes, mechanisms, routes, and nursing considerations.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                    {/* Selector 1 */}
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                        <label className="block text-sm font-semibold text-slate-800 mb-2">Select Medication 1:</label>
                                        <select 
                                            value={compareDrug1.id} 
                                            onChange={(e) => setCompareDrug1(MEDICATIONS.find(m => m.id === e.target.value))}
                                            className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-sm"
                                        >
                                            {MEDICATIONS.map(m => <option key={m.id} value={m.id}>{m.name} ({m.category})</option>)}
                                        </select>
                                    </div>

                                    {/* Selector 2 */}
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                                        <label className="block text-sm font-semibold text-slate-800 mb-2">Select Medication 2:</label>
                                        <select 
                                            value={compareDrug2.id} 
                                            onChange={(e) => setCompareDrug2(MEDICATIONS.find(m => m.id === e.target.value))}
                                            className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-sm"
                                        >
                                            {MEDICATIONS.map(m => <option key={m.id} value={m.id}>{m.name} ({m.category})</option>)}
                                        </select>
                                    </div>
                                </div>

                                {/* Comparison Table */}
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-900 text-white">
                                                    <th className="p-4 text-sm font-semibold w-1/4">Feature</th>
                                                    <th className="p-4 text-sm font-semibold w-3/8">{compareDrug1.name}</th>
                                                    <th className="p-4 text-sm font-semibold w-3/8">{compareDrug2.name}</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-200 text-sm">
                                                <tr>
                                                    <td className="p-4 font-medium bg-slate-50 text-slate-700">Drug Class</td>
                                                    <td className="p-4 text-slate-800">{compareDrug1.class}</td>
                                                    <td className="p-4 text-slate-800">{compareDrug2.class}</td>
                                                </tr>
                                                <tr>
                                                    <td className="p-4 font-medium bg-slate-50 text-slate-700">Therapeutic Category</td>
                                                    <td className="p-4 text-slate-800">{compareDrug1.category}</td>
                                                    <td className="p-4 text-slate-800">{compareDrug2.category}</td>
                                                </tr>
                                                <tr>
                                                    <td className="p-4 font-medium bg-slate-50 text-slate-700">Mechanism of Action</td>
                                                    <td className="p-4 text-slate-800">{compareDrug1.mechanism}</td>
                                                    <td className="p-4 text-slate-800">{compareDrug2.mechanism}</td>
                                                </tr>
                                                <tr>
                                                    <td className="p-4 font-medium bg-slate-50 text-slate-700">Route of Administration</td>
                                                    <td className="p-4 text-slate-800">{compareDrug1.route}</td>
                                                    <td className="p-4 text-slate-800">{compareDrug2.route}</td>
                                                </tr>
                                                <tr>
                                                    <td className="p-4 font-medium bg-slate-50 text-slate-700">Common Side Effects</td>
                                                    <td className="p-4 text-slate-800">{compareDrug1.commonSideEffects.join(', ')}</td>
                                                    <td className="p-4 text-slate-800">{compareDrug2.commonSideEffects.join(', ')}</td>
                                                </tr>
                                                <tr>
                                                    <td className="p-4 font-medium bg-slate-50 text-slate-700">Contraindications</td>
                                                    <td className="p-4 text-slate-800">{compareDrug1.contraindications}</td>
                                                    <td className="p-4 text-slate-800">{compareDrug2.contraindications}</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* RED-FLAG WARNING SYSTEM TAB */}
                        {activeTab === 'redflags' && (
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                                <div className="text-center mb-8">
                                    <span className="bg-rose-100 text-rose-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Clinical Safety Triaging</span>
                                    <h2 className="text-3xl font-extrabold text-slate-900 mt-2">Medication Red-Flag Warning System</h2>
                                    <p className="text-slate-600 text-sm mt-1 max-w-2xl mx-auto">
                                        A visual safety alert system designed to help nurses distinguish between expected side effects, cautionary monitoring, and emergency life-threatening reactions.
                                    </p>
                                </div>

                                <div className="space-y-6">
                                    {RED_FLAGS.map((rf, idx) => (
                                        <div key={idx} className={`p-6 rounded-2xl border ${rf.color} shadow-sm`}>
                                            <div className="flex items-center justify-between mb-3">
                                                <span className={`text-xs font-bold px-3 py-1 rounded-full ${rf.badgeColor}`}>{rf.level} ALERT</span>
                                                <h3 className="text-xl font-bold">{rf.title}</h3>
                                            </div>
                                            <p className="text-sm mb-4">{rf.description}</p>
                                            <div className="bg-white bg-opacity-70 p-4 rounded-xl border border-slate-200 mb-3">
                                                <h4 className="font-semibold text-sm mb-1 uppercase tracking-wider text-slate-800">Key Examples:</h4>
                                                <ul className="list-disc pl-5 text-sm space-y-1 text-slate-700">
                                                    {rf.examples.map((ex, i) => <li key={i}>{ex}</li>)}
                                                </ul>
                                            </div>
                                            <p className="text-sm font-semibold"><strong>Immediate Nursing Action:</strong> {rf.action}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* LEARNING CENTRE & QUIZ TAB */}
                        {activeTab === 'learning' && (
                            <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                                <div className="mb-8 text-center">
                                    <span className="bg-teal-100 text-teal-800 text-xs font-semibold px-3 py-1 rounded-full uppercase">Education & Training</span>
                                    <h2 className="text-3xl font-extrabold text-slate-900 mt-2">Medication Safety Learning Centre</h2>
                                    <p className="text-slate-600 text-sm mt-1">Enhance your clinical expertise with core safety articles and interactive knowledge checks.</p>
                                </div>

                                {/* Educational Articles Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-lg text-slate-900 mb-2">The 6 Rights of Medication Administration</h3>
                                        <p className="text-slate-600 text-sm">Always verify the Right Patient, Right Medication, Right Dose, Right Route, Right Time, and Right Documentation to eliminate administration errors.</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-lg text-slate-900 mb-2">Preventing Medication Errors in Nursing</h3>
                                        <p className="text-slate-600 text-sm">Emphasize double-checking high-alert medications (such as insulin and heparin), effective interprofessional communication, and rigorous Barcode Medication Administration (BCMA).</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-lg text-slate-900 mb-2">High-Alert Medications & Safety Protocols</h3>
                                        <p className="text-slate-600 text-sm">High-alert drugs bear a heightened risk of causing significant patient harm when used in error. Independent double-checks are mandatory for IV infusions.</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-lg text-slate-900 mb-2">Pharmacovigilance & Adverse Drug Reaction Reporting</h3>
                                        <p className="text-slate-600 text-sm">Report adverse drug reactions to national regulatory bodies (such as NAFDAC in Nigeria or FDA MedWatch in the US) to support post-market drug safety monitoring.</p>
                                    </div>
                                </div>

                                {/* Interactive Quiz Section */}
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
                                    <h3 className="text-2xl font-bold text-slate-900 mb-2">Interactive Knowledge Check Quiz</h3>
                                    <p className="text-slate-600 text-sm mb-6">Test your pharmacology and medication safety knowledge.</p>

                                    <div className="space-y-8">
                                        {QUIZZES.map((q, idx) => (
                                            <div key={q.id} className="p-6 bg-slate-50 rounded-xl border border-slate-200">
                                                <h4 className="font-bold text-slate-900 text-base mb-3">Q{idx+1}. {q.question}</h4>
                                                <div className="space-y-2">
                                                    {q.options.map((opt, oIdx) => {
                                                        const isSelected = quizAnswers[q.id] === oIdx;
                                                        const isCorrect = q.correct === oIdx;
                                                        let btnColor = "bg-white border-slate-300 text-slate-800 hover:bg-slate-100";
                                                        if (quizSubmitted) {
                                                            if (isCorrect) btnColor = "bg-emerald-100 border-emerald-500 text-emerald-900 font-semibold";
                                                            else if (isSelected && !isCorrect) btnColor = "bg-rose-100 border-rose-500 text-rose-900";
                                                        } else if (isSelected) {
                                                            btnColor = "bg-teal-50 border-teal-600 text-teal-900 font-semibold";
                                                        }
                                                        return (
                                                            <button
                                                                key={oIdx}
                                                                onClick={() => !quizSubmitted && setQuizAnswers(prev => ({ ...prev, [q.id]: oIdx }))}
                                                                className={`w-full text-left p-3 rounded-lg border text-sm transition ${btnColor}`}
                                                            >
                                                                {opt}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                                {quizSubmitted && (
                                                    <div className="mt-3 text-xs text-slate-600 bg-white p-3 rounded-lg border border-slate-200">
                                                        <strong>Explanation:</strong> {q.explanation}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>

                                    <div className="mt-8 flex justify-center">
                                        {!quizSubmitted ? (
                                            <button 
                                                onClick={() => setQuizSubmitted(true)}
                                                className="bg-teal-600 hover:bg-teal-700 text-white font-semibold px-8 py-3 rounded-xl transition shadow"
                                            >
                                                Submit Answers & Check Score
                                            </button>
                                        ) : (
                                            <button 
                                                onClick={() => { setQuizSubmitted(false); setQuizAnswers({}); }}
                                                className="bg-slate-800 hover:bg-slate-700 text-white font-semibold px-8 py-3 rounded-xl transition shadow"
                                            >
                                                Retake Quiz
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ABOUT TAB */}
                        {activeTab === 'about' && (
                            <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 sm:p-12">
                                    <span className="bg-teal-100 text-teal-800 text-xs font-semibold px-3 py-1 rounded-full uppercase">Project Overview</span>
                                    <h2 className="text-3xl font-extrabold text-slate-900 mt-3 mb-6">About MediGuard</h2>
                                    
                                    <div className="space-y-4 text-slate-700 leading-relaxed text-base">
                                        <p>
                                            <strong>MediGuard</strong> is an educational medication safety and nursing support platform designed specifically for nursing students, registered nurses, and healthcare professionals.
                                        </p>
                                        <p>
                                            Its primary purpose is to make reliable medication information easily accessible and help healthcare professionals understand drug actions, identify potential adverse effects, recognize complications, and apply appropriate nursing responsibilities.
                                        </p>
                                        
                                        <h3 className="text-xl font-bold text-slate-900 pt-4">Ethical & Clinical Safeguards</h3>
                                        <ul className="list-disc pl-5 space-y-2">
                                            <li><strong>Patient Privacy:</strong> MediGuard does not collect or store patient-specific clinical data or personal identifiers.</li>
                                            <li><strong>Clinical Accountability:</strong> Nurses retain sole professional responsibility for clinical judgment and patient care. AI and simulated tools are educational aids only and never override prescriptions.</li>
                                            <li><strong>Evidence-Based Standards:</strong> Drug profiles are curated from reputable references including WHO, DailyMed, FDA, and national regulatory bodies.</li>
                                        </ul>
                                    </div>

                                    <div className="mt-8 pt-8 border-t border-slate-200 flex justify-between items-center">
                                        <span className="text-xs text-slate-500">MediGuard Educational Prototype v2.5</span>
                                        <button onClick={() => setActiveTab('home')} className="bg-teal-600 hover:bg-teal-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition">
                                            Return to Home
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* AI Assistant Modal */}
                    {aiModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900 bg-opacity-60 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 sm:p-8 relative border border-slate-200">
                                <button 
                                    onClick={() => setAiModalOpen(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-xl font-bold"
                                >
                                    ✕
                                </button>
                                
                                <div className="flex items-center gap-3 mb-4">
                                    <span className="text-2xl">✨</span>
                                    <div>
                                        <h3 className="text-xl font-bold text-slate-900">
                                            {aiMode === 'explain' ? 'AI Drug Explanation Assistant' : 'MediGuard Nursing Support Assistant'}
                                        </h3>
                                        <p className="text-xs text-slate-500">Demonstration assistant powered by reviewed clinical data</p>
                                    </div>
                                </div>

                                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 min-h-[200px] max-h-[400px] overflow-y-auto text-sm text-slate-800">
                                    {aiLoading ? (
                                        <div className="flex flex-col items-center justify-center py-12 space-y-3">
                                            <div className="w-8 h-8 border-4 border-teal-600 border-t-transparent rounded-full animate-spin"></div>
                                            <p className="text-slate-500 text-sm">Analyzing reviewed drug profile...</p>
                                        </div>
                                    ) : (
                                        <div className="whitespace-pre-line leading-relaxed">
                                            {aiResponse}
                                        </div>
                                    )}
                                </div>

                                <div className="mt-6 flex justify-end">
                                    <button 
                                        onClick={() => setAiModalOpen(false)}
                                        className="bg-slate-900 hover:bg-slate-800 text-white font-medium px-6 py-2 rounded-lg text-sm transition"
                                    >
                                        Close Assistant
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 py-10 mt-16 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="bg-slate-800 border border-slate-700 p-6 rounded-xl mb-8">
                                <h4 className="font-bold text-white text-sm mb-2 uppercase tracking-wider">Educational Disclaimer</h4>
                                <p className="text-xs text-slate-300 leading-relaxed">
                                    MediGuard is an educational medication information and nursing support platform. It is designed to improve access to drug information and support professional learning. It does not replace clinical assessment, professional nursing judgement, a valid prescription, institutional policies or established clinical guidelines. Medication administration and patient care must be based on individual patient assessments and appropriate professional guidance. Always verify medication information using authoritative references. In emergencies, follow institutional emergency procedures and seek immediate clinical assistance.
                                </p>
                            </div>

                            <div className="flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
                                <p>© 2026 MediGuard Platform. Designed for Nursing Education & Clinical Practice.</p>
                                <div className="flex space-x-6">
                                    <button onClick={() => setActiveTab('home')} className="hover:text-white transition">Home</button>
                                    <button onClick={() => setActiveTab('directory')} className="hover:text-white transition">Drug Directory</button>
                                    <button onClick={() => setActiveTab('redflags')} className="hover:text-white transition">Red Flags</button>
                                    <button onClick={() => setActiveTab('about')} className="hover:text-white transition">About</button>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
